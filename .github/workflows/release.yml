name: Build release apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libpulse0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Confirm tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_VERSION="$(python -c 'from squeak import __version__; print(__version__)')"
          test "v${APP_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}."
            exit 1
          }

      - name: Compile and test
        run: |
          python -m compileall -q app.py squeak
          python -m unittest discover -s tests -v

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: Squeak-macOS-Apple-Silicon.zip
          - os: macos-15-intel
            artifact: Squeak-macOS-Intel.zip
          - os: windows-2022
            artifact: Squeak-Windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Build Squeak
        run: pyinstaller squeak.spec --noconfirm --clean

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Squeak.app "${{ matrix.artifact }}"

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Squeak -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Download completed app packages
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --verify-tag \
              --latest \
              --title "Squeak ${GITHUB_REF_NAME}" \
              --generate-notes \
              --notes "$(cat .github/release-intro.md)"
          fi
